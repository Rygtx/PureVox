name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform 34 + NDK r27
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-34" "ndk;27.0.12077973" "build-tools;34.0.0"

      - name: Download Opus source (android/opus-src is gitignored)
        run: |
          mkdir -p android/opus-src
          wget -q -O /tmp/opus.zip https://github.com/xiph/opus/archive/refs/tags/v1.5.2.zip
          unzip -q /tmp/opus.zip -d /tmp
          mv /tmp/opus-1.5.2/* android/opus-src/
          test -f android/opus-src/CMakeLists.txt

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PureVoxMic-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
