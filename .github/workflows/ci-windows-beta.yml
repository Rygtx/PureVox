name: Lite CI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  windows-lite:
    name: Windows Lite (no gcc, pure python)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set build timestamp (tag v* -> tag version; else now)
        id: ts
        shell: pwsh
        run: |
          $ref = $env:GITHUB_REF_NAME
          if ($ref -and $ref.StartsWith("v")) { $ref = $ref.Substring(1) }
          if ($env:GITHUB_REF_NAME) {
            $stamp = $ref -replace '\.', '-'
          } else {
            $stamp = Get-Date -Format 'yyyy-MM-dd-HHmm'
          }
          "stamp=$stamp" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-win.txt

      - name: Install Python deps (lite, no gcc)
        shell: pwsh
        run: |
          python -m pip install -q onnxruntime==1.22.0 numpy pillow
          try { python -m pip install -q pyaudio } catch { Write-Host "pyaudio optional, skip on CI" }
          Write-Host "deps OK"

      - name: Compile lite sources (catch syntax errors)
        shell: pwsh
        run: |
          python -m compileall -q lite_denoise_only
          Write-Host "compileall lite OK"

      - name: Smoke import lite (no gcc, pure python)
        shell: pwsh
        run: |
          python -c "import lite_denoise_only.config, lite_denoise_only.audio, lite_denoise_only.engine, lite_denoise_only.ui; print('lite import OK')"
          python -c "from lite_denoise_only.engine import LiteDenoiseEngine; print('engine OK')"

      - name: Package lite as zip (no build, pure python)
        shell: pwsh
        run: |
          Compress-Archive -Path lite_denoise_only -DestinationPath PureVoxLite-${{ steps.ts.outputs.stamp }}.zip -Force
          Get-ChildItem PureVoxLite-*.zip | Format-Table Name,Length

      - name: Upload Lite artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: PureVoxLite-${{ steps.ts.outputs.stamp }}
          path: PureVoxLite-*.zip
          if-no-files-found: error
