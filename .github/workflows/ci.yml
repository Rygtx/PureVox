name: PureVox CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu-22.04
            container: ubuntu:22.04
            sysdeps: "build-essential make pkg-config libpipewire-0.3-dev python3 python3-pip python3-setuptools"
            pkg_deb: true
          - distro: ubuntu-24.04
            container: ubuntu:24.04
            sysdeps: "build-essential make pkg-config libpipewire-0.3-dev python3 python3-pip python3-setuptools"
            pkg_deb: true
          - distro: fedora
            container: fedora:latest
            sysdeps: "gcc make pkgconf-pkg-config pipewire-devel python3 python3-pip python3-setuptools"
            # deb 只在 Ubuntu 分发（Depends 按 AOSC 包名）
            pkg_deb: false
          # Python 3.8 底线（内嵌运行环境为 Py3.8，Win7 最低）：官方镜像验证纯 C 库
          # 在该底线上可编译、可 ctypes 加载。
          - distro: python3.8
            container: python:3.8-bullseye
            sysdeps: "build-essential pkg-config libpipewire-0.3-dev"
            pkg_deb: false
    container:
      image: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ${{ matrix.sysdeps }}
          else
            dnf install -y --quiet ${{ matrix.sysdeps }}
          fi

      - name: Build pure C shared libraries (libaimic.so + libpvpipe.so)
        # 使用仓库内已提交的捆绑 C onnxruntime 1.11.1 SDK（packages/onnxruntime-linux-x64-1.11.1），
        # 不做 Python 层 onnx/onnxruntime；aimic.c 链接 libonnxruntime.so.1.11.1。
        # python3.8 镜像下用 python 命令（即 3.8）；其余用 python3。
        run: |
          PY="python3"; [ "${{ matrix.distro }}" = "python3.8" ] && PY="python"
          LD_LIBRARY_PATH="$PWD/packages/onnxruntime-linux-x64-1.11.1/lib" \
            $PY setup.py build_ext --inplace --force
          test -f libaimic.so && test -f libpvpipe.so

      - name: Import smoke test (ctypes 加载纯 C 库)
        run: |
          PY="python3"; [ "${{ matrix.distro }}" = "python3.8" ] && PY="python"
          LD_LIBRARY_PATH="$PWD/packages/onnxruntime-linux-x64-1.11.1/lib" \
            $PY -c "import aimic, pvpipe; print('aimic OK'); print('pvpipe OK')"

      - name: Assert Python 3.8 baseline (python3.8 only)
        if: matrix.distro == 'python3.8'
        run: |
          LD_LIBRARY_PATH="$PWD/packages/onnxruntime-linux-x64-1.11.1/lib" \
            python -c "import sys, aimic; assert sys.version_info[:2] == (3, 8); print('aimic OK on Python', sys.version.split()[0])"

      - name: Package deb (Ubuntu only)
        if: matrix.pkg_deb
        run: |
          python3 -m pip install --upgrade --break-system-packages pillow 2>/dev/null \
            || python3 -m pip install --upgrade pillow >/dev/null
          bash pack_deb.sh
          ls -lh dist/purevox_*.deb

      - name: Upload deb artifact
        if: matrix.pkg_deb
        uses: actions/upload-artifact@v5
        with:
          name: purevox-deb-${{ matrix.distro }}
          path: dist/purevox_*.deb
          if-no-files-found: error

  windows:
    name: Windows (aimic.dll + EXE)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.8
        uses: actions/setup-python@v6
        with:
          python-version: "3.8"

      - name: Set up mingw-w64 gcc
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc

      - name: Install Python deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -q -r requirements.txt -r requirements-win.txt

      - name: Build aimic.dll (mingw gcc)
        shell: pwsh
        env:
          CC: ${{ steps.msys2.outputs.msys2-location }}\mingw64\bin\gcc.exe
        run: |
          python setup.py build_ext --inplace --force
          if (-not (Test-Path "aimic.dll")) { throw "aimic.dll not built" }

      - name: Compile all Python sources (catch syntax errors)
        shell: pwsh
        run: |
          python -m compileall -q aimic.py pvpipe.py audio_processor.py config_manager.py model_config.py ui_pyside6.py run_pyside6.py pvplatform server 2>$null
          Write-Host "compileall OK"

      - name: Smoke import aimic (ctypes loads aimic.dll)
        shell: pwsh
        run: |
          $env:PATH = "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin;$env:PATH"
          python -c "import aimic; print('aimic OK on Python', __import__('sys').version.split()[0])"

      - name: Download opus.dll (gitignored, needed by server/)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/DSharpPlus/DSharpPlus/raw/master/docs/natives/vnext_natives_win32_x64.zip" -OutFile "$env:TEMP\opus.zip"
          Expand-Archive -Path "$env:TEMP\opus.zip" -DestinationPath "$env:TEMP\opus" -Force
          Copy-Item "$env:TEMP\opus\libopus.dll" "server\opus.dll" -Force
          if (-not (Test-Path "server\opus.dll")) { throw "opus.dll not found" }

      - name: Build self-extracting EXE
        shell: pwsh
        env:
          CC: ${{ steps.msys2.outputs.msys2-location }}\mingw64\bin\gcc.exe
        run: |
          $env:PATH = "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin;$env:PATH"
          pwsh -NoProfile -ExecutionPolicy Bypass -File build_win.ps1

      - name: Upload EXE
        uses: actions/upload-artifact@v5
        with:
          name: PureVox-win-x64
          path: dist/PureVox_*.exe
          if-no-files-found: error

  android:
    name: Android (debug APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform 34 + NDK r27
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-34" "ndk;27.0.12077973" "build-tools;34.0.0"

      - name: Download Opus source (android/opus-src is gitignored)
        run: |
          mkdir -p android/opus-src
          wget -q -O /tmp/opus.zip https://github.com/xiph/opus/archive/refs/tags/v1.5.2.zip
          unzip -q /tmp/opus.zip -d /tmp
          mv /tmp/opus-1.5.2/* android/opus-src/
          test -f android/opus-src/CMakeLists.txt

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: PureVoxMic-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
