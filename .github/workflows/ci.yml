name: PureVox CI

on:
  # Only tag pushes (v...) run CI: branch pushes must stay cheap so everyday
  # commits never trigger a full build. Manually trigger via workflow_dispatch
  # to verify the branch without tagging.
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  linux:
    name: Linux (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal packages: deb (Ubuntu) + AppImage; fedora -> rpm; python3.12 baseline.
          - distro: ubuntu-22.04
            container: ubuntu:22.04
            # 预编译内嵌 Python（python-build-standalone install_only 包，见
            # bootstrap_python312.sh），无需编译——不再需要 libssl-dev/libffi-dev。
            # file: appimagetool requires the `file` command at packaging time.
            sysdeps: "make pkg-config libopus0 python3 python3-pip python3-setuptools imagemagick wget git file"
            pkg_deb: true
            pkg_appimage: true
          - distro: fedora
            container: fedora:latest
            sysdeps: "make python3 python3-pip python3-setuptools rpm-build"
            pkg_rpm: true
          # Python 3.12 baseline: verify the pure-Python engine imports and runs there
          # (CI matrix uses 3.12; bundled runtime is 3.12).
          - distro: python3.12
            container: python:3.12-bullseye
            sysdeps: ""
            baseline: true
    container:
      image: ${{ matrix.container }}
    steps:
      # Install system dependencies BEFORE checkout: containers have no git, so
      # actions/checkout would fall back to the REST API download (no .git dir).
      - name: Install system dependencies
        run: |
          if [ -n "${{ matrix.sysdeps }}" ]; then
            if command -v apt-get >/dev/null; then
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ${{ matrix.sysdeps }}
            else
              dnf install -y --quiet ${{ matrix.sysdeps }}
            fi
          fi

      - uses: actions/checkout@v5
        # bootstrap_python312.sh 按需下载 python-build-standalone 预编译包
        # （cpython 3.12.14，~/.cache/purevox 可跨任务缓存），无需编译

      - name: Set build timestamp (tag v* -> tag version; else now)
        id: ts
        run: |
          if [[ "${GITHUB_REF_NAME:-}" == v* ]]; then
            stamp="${GITHUB_REF_NAME#v}"
            stamp="${stamp//./-}"
            echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
          else
            echo "stamp=$(date +'%Y-%m-%d-%H%M')" >> "$GITHUB_OUTPUT"
          fi

      # 与本地同一套 pin 版本（requirements.txt），避免 CI 与本地行为漂移
      - name: Install Python deps (pinned, from requirements.txt)
        run: |
          PY="python3"; [ "${{ matrix.distro }}" = "python3.12" ] && PY="python"
          $PY -m pip install --quiet -r requirements.txt 2>/dev/null \
            || $PY -m pip install --break-system-packages -r requirements.txt || true
          # pillow 仅打包脚本需要（图标生成），不属引擎运行依赖
          $PY -m pip install --quiet pillow 2>/dev/null \
            || $PY -m pip install --break-system-packages pillow || true

      # ── 预置缓存：避免每次 CI 重复下载（预编译内嵌 python312）──
      - name: Cache embedded python312 (python-build-standalone)
        if: matrix.pkg_appimage
        uses: actions/cache@v4
        with:
          path: |
            packages/python312
            ~/.cache/purevox
          key: py312-embedded-ubuntu22-pbs-cpython-3.12.14-20260814
      - name: Cache appimagetool binary
        if: matrix.pkg_appimage
        uses: actions/cache@v4
        with:
          path: ~/.cache/purevox
          key: appimagetool-continuous-x64

      - name: Import smoke test (pure-Python engine loads a model and denoises one frame)
        run: |
          PY="python3"; [ "${{ matrix.distro }}" = "python3.12" ] && PY="python"
          $PY - <<'EOF'
          import sys, os
          import numpy as np
          import aimic
          ap = aimic.AudioProcessor(0.0, 'models/v9_fft2048_band256_epoch_261.onnx')
          x = (np.sin(np.arange(1024) * 0.05) * 0.3).astype('float32')
          out = ap.process(x.tolist())
          assert len(out) == 1024
          print('pvengine OK on Python', sys.version.split()[0])
          EOF

      - name: Assert Python 3.12 baseline (python3.12 only)
        if: matrix.baseline
        run: |
          python -c "import sys; assert sys.version_info[:2] == (3, 12); print('Python', sys.version.split()[0])"

      - name: Package deb (Ubuntu)
        if: matrix.pkg_deb
        run: |
          bash pack_deb.sh
          ls -lh dist/PureVox-Linux-x64-*.deb

      - name: Upload deb artifact
        if: matrix.pkg_deb
        uses: actions/upload-artifact@v7.0.1
        with:
          name: PureVox-Linux-x64-${{ steps.ts.outputs.stamp }}-release-deb
          path: dist/PureVox-Linux-x64-*.deb
          if-no-files-found: error

      - name: Package rpm (Fedora)
        if: matrix.pkg_rpm
        run: |
          bash pack_rpm.sh
          ls -lh dist/PureVox-Linux-x64-*.rpm

      - name: Upload rpm artifact
        if: matrix.pkg_rpm
        uses: actions/upload-artifact@v7.0.1
        with:
          name: PureVox-Linux-x64-${{ steps.ts.outputs.stamp }}-release-rpm
          path: dist/PureVox-Linux-x64-*.rpm
          if-no-files-found: error

      - name: Package AppImage (best-effort, bundles embedded python312)
        if: matrix.pkg_appimage
        continue-on-error: true
        run: |
          bash pack_appimage.sh
          ls -lh dist/PureVox-Linux-x64-*.AppImage

      - name: Upload AppImage artifact
        if: matrix.pkg_appimage
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: PureVox-Linux-x64-${{ steps.ts.outputs.stamp }}-release-appimage
          path: dist/PureVox-Linux-x64-*.AppImage
          if-no-files-found: ignore

  windows:
    name: Windows (pure-Python bundle directory)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set build timestamp (tag v* -> tag version; else now)
        id: ts
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -like 'v*') {
            $stamp = $env:GITHUB_REF_NAME.Substring(1) -replace '\.', '-'
          } else {
            $stamp = Get-Date -Format 'yyyy-MM-dd-HHmm'
          }
          "stamp=$stamp" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-win.txt

      - name: Install Python deps
        shell: pwsh
        run: |
          python -m pip install -q -r requirements.txt -r requirements-win.txt

      - name: Compile all Python sources (catch syntax errors before packaging)
        shell: pwsh
        run: |
          python -m compileall -q aimic.py pvengine audio_processor.py config_manager.py model_config.py about_content.py run_tk.py uitk pvplatform server 2>$null
          Write-Host "compileall OK"

      # server/opus.dll 已随仓库提交（预编译 libopus，BSD），无需再下载

      - name: Build Windows bundle (PyInstaller, timestamped)
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File build_win.ps1

      - name: Smoke import engine (pure Python, loads the denoise model)
        shell: pwsh
        run: |
          python -c "import aimic, numpy as _np; ap = aimic.AudioProcessor(0.0, 'models/v9_fft2048_band256_epoch_261.onnx'); out = ap.process([0.0] * 1024); assert len(out) == 1024; print('pvengine OK on Python', __import__('sys').version.split()[0])"

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v7.0.1
        with:
          # upload-artifact already compresses to a zip; a separate 7z pass is pure waste.
          name: PureVox-Windows-x64-${{ steps.ts.outputs.stamp }}-release
          path: dist/PureVox
          if-no-files-found: error

  android:
    name: Android (debug APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set build timestamp (tag v* -> tag version; else now)
        id: ts
        run: |
          if [[ "${GITHUB_REF_NAME:-}" == v* ]]; then
            stamp="${GITHUB_REF_NAME#v}"
            stamp="${stamp//./-}"
            echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
          else
            echo "stamp=$(date +'%Y-%m-%d-%H%M')" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Install SDK platform 34 + NDK r27
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-34" "ndk;27.0.12077973" "build-tools;34.0.0"

      # 缓存 opus 源码：命中则跳过下载（2026-08-22 纯 py 迁移）
      - name: Cache opus source
        uses: actions/cache@v4
        with:
          path: android/opus-src
          key: opus-src-1.5.2

      - name: Download Opus source (android/opus-src is gitignored)
        run: |
          if [ -f android/opus-src/CMakeLists.txt ]; then
            echo "opus-src cached, skip download"
          else
            mkdir -p android/opus-src
            wget -q -O /tmp/opus.zip https://github.com/xiph/opus/archive/refs/tags/v1.5.2.zip
            unzip -q /tmp/opus.zip -d /tmp
            mv /tmp/opus-1.5.2/* android/opus-src/
            test -f android/opus-src/CMakeLists.txt
          fi

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Rename APK with timestamp (tag v* -> tag version; else now)
        run: |
          if [[ "${GITHUB_REF_NAME:-}" == v* ]]; then
            stamp="${GITHUB_REF_NAME#v}"
            stamp="${stamp//./-}"
          else
            stamp=$(date +'%Y-%m-%d-%H%M')
          fi
          mv android/app/build/outputs/apk/debug/app-debug.apk "PureVox-Android-arm64-$stamp-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: PureVox-Android-arm64-${{ steps.ts.outputs.stamp }}-debug-apk
          path: PureVox-Android-arm64-*.apk
          if-no-files-found: error

  release:
    name: Release (tag -> attach all artifacts)
    runs-on: ubuntu-latest
    needs: [linux, windows, android]
    # Only when a tag is pushed (e.g. v2026.08.10.1517). The three build jobs
    # re-run for that exact ref so the release carries this tag's artifacts.
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout full history (commit log for release notes)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v7.0.0
        with:
          path: artifacts

      - name: Pack Windows bundle directory into a zip
        shell: bash
        run: |
          cd artifacts
          shopt -s nullglob
          for d in PureVox-Windows-*-release/; do
            zip -q -9 -r "${d%/}.zip" "$d"
            rm -rf "$d"
          done

      - name: Build release notes (commit log since previous tag)
        run: |
          # 自动化日志：上一个 tag 到当前 tag 的全部提交
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "自动发布：tag ${GITHUB_REF_NAME} 对应的 CI 构建产物（deb / rpm / AppImage / Windows / Android APK）。"
            echo ""
            echo "**提交记录**"
            if [ -n "$prev" ]; then
              git log --pretty="format:- %h %s" "$prev..${GITHUB_REF_NAME}"
            else
              git log --pretty="format:- %h %s" -15
            fi
          } > notes.md

      - name: Create GitHub release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          files=$(find . -type f | sort | tr '\n' ' ')
          gh release create -R "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" \
            --title "PureVox ${GITHUB_REF_NAME}" \
            --notes-file "${GITHUB_WORKSPACE}/notes.md" \
            $files
