name: PureVox CI

on:
  # Only tag pushes (v...) run CI: branch pushes must stay cheap so everyday
  # commits never trigger a full build. Manually trigger via workflow_dispatch
  # to verify the branch without tagging.
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  linux:
    name: Linux (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal packages: deb (Ubuntu) + AppImage; fedora -> rpm; python3.8 baseline.
          - distro: ubuntu-22.04
            container: ubuntu:22.04
            # libssl-dev: the AppImage job compiles the embedded CPython from the
            # packages/cpython submodule; without ssl headers that interpreter's
            # pip has no networking, so bootstrap_python38.sh fails.
            # libffi-dev: the embedded CPython needs libffi to build the `_ctypes`
            # module (aimic.py/pvpipe.py ctypes bindings depend on it). Without it
            # the compiled interpreter has no _ctypes and the GUI crashes on import
            # ctypes (ModuleNotFoundError: No module named '_ctypes').
            # file: appimagetool requires the `file` command at packaging time.
            sysdeps: "build-essential make pkg-config libpipewire-0.3-dev libasound2-dev libssl-dev libffi-dev python3 python3-pip python3-setuptools imagemagick wget git zlib1g-dev file"
            pkg_deb: true
            pkg_appimage: true
          - distro: fedora
            container: fedora:latest
            sysdeps: "gcc make pkgconf-pkg-config pipewire-devel alsa-lib-devel python3 python3-pip python3-setuptools rpm-build"
            pkg_rpm: true
          # Python 3.8 baseline (embedded runtime is Py3.8, Win7 minimum): verify the
          # pure C libs build and ctypes-load on that floor.
          - distro: python3.8
            container: python:3.8-bullseye
            sysdeps: "build-essential pkg-config libpipewire-0.3-dev libasound2-dev"
            baseline: true
    container:
      image: ${{ matrix.container }}
    steps:
      # Install system dependencies BEFORE checkout: containers have no git, so
      # actions/checkout would fall back to the REST API download (no .git dir),
      # which does NOT support `submodules`. With git present it does a real
      # clone and can fetch packages/cpython (needed only by the AppImage job).
      - name: Install system dependencies
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ${{ matrix.sysdeps }}
          else
            dnf install -y --quiet ${{ matrix.sysdeps }}
          fi

      - uses: actions/checkout@v5
        with:
          # Only the AppImage job needs the cpython submodule; shallow clone stays cheap.
          submodules: ${{ matrix.pkg_appimage && 'recursive' || 'false' }}

      - name: Set build timestamp (tag v* -> tag version; else now)
        id: ts
        run: |
          if [[ "${GITHUB_REF_NAME:-}" == v* ]]; then
            stamp="${GITHUB_REF_NAME#v}"
            stamp="${stamp//./-}"
            echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
          else
            echo "stamp=$(date +'%Y-%m-%d-%H%M')" >> "$GITHUB_OUTPUT"
          fi

      - name: Build pure C shared libraries (libaimic.so + libpvpipe.so + libpvalsa.so)
        run: |
          PY="python3"; [ "${{ matrix.distro }}" = "python3.8" ] && PY="python"
          LD_LIBRARY_PATH="$PWD/packages/onnxruntime-linux-x64-1.11.1/lib" \
            $PY setup.py build_ext --inplace --force
          test -f libaimic.so && test -f libpvpipe.so && test -f libpvalsa.so

      - name: Import smoke test (ctypes loads the pure C libs)
        run: |
          PY="python3"; [ "${{ matrix.distro }}" = "python3.8" ] && PY="python"
          LD_LIBRARY_PATH="$PWD/packages/onnxruntime-linux-x64-1.11.1/lib" \
            $PY -c "import aimic, pvpipe, pvalsa; print('aimic OK'); print('pvpipe OK'); print('pvalsa OK')"

      - name: Assert Python 3.8 baseline (python3.8 only)
        if: matrix.baseline
        run: |
          LD_LIBRARY_PATH="$PWD/packages/onnxruntime-linux-x64-1.11.1/lib" \
            python -c "import sys, aimic; assert sys.version_info[:2] == (3, 8); print('aimic OK on Python', sys.version.split()[0])"

      - name: Package deb (Ubuntu)
        if: matrix.pkg_deb
        run: |
          python3 -m pip install --break-system-packages pillow 2>/dev/null \
            || python3 -m pip install pillow >/dev/null
          bash pack_deb.sh
          ls -lh dist/PureVox-Linux-x64-*.deb

      - name: Upload deb artifact
        if: matrix.pkg_deb
        uses: actions/upload-artifact@v7.0.1
        with:
          name: PureVox-Linux-x64-${{ steps.ts.outputs.stamp }}-release-deb
          path: dist/PureVox-Linux-x64-*.deb
          if-no-files-found: error

      - name: Package rpm (Fedora)
        if: matrix.pkg_rpm
        run: |
          python3 -m pip install --break-system-packages pillow 2>/dev/null \
            || python3 -m pip install pillow >/dev/null
          bash pack_rpm.sh
          ls -lh dist/PureVox-Linux-x64-*.rpm

      - name: Upload rpm artifact
        if: matrix.pkg_rpm
        uses: actions/upload-artifact@v7.0.1
        with:
          name: PureVox-Linux-x64-${{ steps.ts.outputs.stamp }}-release-rpm
          path: dist/PureVox-Linux-x64-*.rpm
          if-no-files-found: error

      - name: Package AppImage (best-effort, bundles embedded python38)
        if: matrix.pkg_appimage
        continue-on-error: true
        run: |
          bash pack_appimage.sh
          ls -lh dist/PureVox-Linux-x64-*.AppImage

      - name: Upload AppImage artifact
        if: matrix.pkg_appimage
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: PureVox-Linux-x64-${{ steps.ts.outputs.stamp }}-release-appimage
          path: dist/PureVox-Linux-x64-*.AppImage
          if-no-files-found: ignore

  windows:
    name: Windows (aimic.dll + bundle directory)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set build timestamp (tag v* -> tag version; else now)
        id: ts
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -like 'v*') {
            $stamp = $env:GITHUB_REF_NAME.Substring(1) -replace '\.', '-'
          } else {
            $stamp = Get-Date -Format 'yyyy-MM-dd-HHmm'
          }
          "stamp=$stamp" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Set up Python 3.8
        uses: actions/setup-python@v6
        with:
          python-version: "3.8"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-win.txt

      - name: Set up mingw-w64 gcc
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc

      - name: Install Python deps
        shell: pwsh
        run: |
          python -m pip install -q -r requirements.txt -r requirements-win.txt

      - name: Compile all Python sources (catch syntax errors before packaging)
        shell: pwsh
        run: |
          python -m compileall -q aimic.py pvpipe.py audio_processor.py config_manager.py model_config.py ui_pyside6.py run_pyside6.py pvplatform server 2>$null
          Write-Host "compileall OK"

      - name: Download opus.dll (gitignored, needed by server/)
        shell: pwsh
        run: |
          curl.exe -fsSL -L "https://github.com/DSharpPlus/DSharpPlus/raw/master/docs/natives/vnext_natives_win32_x64.zip" -o "$env:TEMP\opus.zip"
          Expand-Archive -Path "$env:TEMP\opus.zip" -DestinationPath "$env:TEMP\opus" -Force
          Copy-Item "$env:TEMP\opus\libopus.dll" "server\opus.dll" -Force
          if (-not (Test-Path "server\opus.dll")) { throw "opus.dll not found" }

      - name: Build Windows bundle (build aimic.dll + PyInstaller, timestamped)
        shell: pwsh
        env:
          CC: ${{ steps.msys2.outputs.msys2-location }}\mingw64\bin\gcc.exe
        run: |
          $env:PATH = "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin;$env:PATH"
          pwsh -NoProfile -ExecutionPolicy Bypass -File build_win.ps1

      - name: Smoke import aimic (ctypes loads the built aimic.dll)
        shell: pwsh
        run: |
          $env:PATH = "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin;$env:PATH"
          if (-not (Test-Path "aimic.dll")) { throw "aimic.dll not built by build_win.ps1" }
          python -c "import aimic; print('aimic OK on Python', __import__('sys').version.split()[0])"

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v7.0.1
        with:
          # upload-artifact already compresses to a zip; a separate 7z pass is pure waste.
          name: PureVox-Windows-x64-${{ steps.ts.outputs.stamp }}-release
          path: dist/PureVox
          if-no-files-found: error

  android:
    name: Android (debug APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set build timestamp (tag v* -> tag version; else now)
        id: ts
        run: |
          if [[ "${GITHUB_REF_NAME:-}" == v* ]]; then
            stamp="${GITHUB_REF_NAME#v}"
            stamp="${stamp//./-}"
            echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
          else
            echo "stamp=$(date +'%Y-%m-%d-%H%M')" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Install SDK platform 34 + NDK r27
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-34" "ndk;27.0.12077973" "build-tools;34.0.0"

      - name: Download Opus source (android/opus-src is gitignored)
        run: |
          mkdir -p android/opus-src
          wget -q -O /tmp/opus.zip https://github.com/xiph/opus/archive/refs/tags/v1.5.2.zip
          unzip -q /tmp/opus.zip -d /tmp
          mv /tmp/opus-1.5.2/* android/opus-src/
          test -f android/opus-src/CMakeLists.txt

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Rename APK with timestamp (tag v* -> tag version; else now)
        run: |
          if [[ "${GITHUB_REF_NAME:-}" == v* ]]; then
            stamp="${GITHUB_REF_NAME#v}"
            stamp="${stamp//./-}"
          else
            stamp=$(date +'%Y-%m-%d-%H%M')
          fi
          mv android/app/build/outputs/apk/debug/app-debug.apk "PureVox-Android-arm64-$stamp-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: PureVox-Android-arm64-${{ steps.ts.outputs.stamp }}-debug-apk
          path: PureVox-Android-arm64-*.apk
          if-no-files-found: error

  release:
    name: Release (tag -> attach all artifacts)
    runs-on: ubuntu-latest
    needs: [linux, windows, android]
    # Only when a tag is pushed (e.g. v2026.08.10.1517). The three build jobs
    # re-run for that exact ref so the release carries this tag's artifacts.
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v7.0.0
        with:
          path: artifacts

      - name: Pack Windows bundle directory into a zip
        shell: bash
        run: |
          cd artifacts
          shopt -s nullglob
          for d in PureVox-Windows-*-release/; do
            zip -q -9 -r "${d%/}.zip" "$d"
            rm -rf "$d"
          done

      - name: Create GitHub release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          files=$(find . -type f | sort | tr '\n' ' ')
          gh release create -R "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" \
            --title "PureVox ${GITHUB_REF_NAME}" \
            --notes "自动发布：tag ${GITHUB_REF_NAME} 对应的 CI 构建产物（deb / rpm / AppImage / Windows / Android APK）。" \
            $files
