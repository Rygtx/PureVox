name: PureVox Linux

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build + deb (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu-22.04
            container: ubuntu:22.04
            sysdeps: "build-essential make pkg-config libpipewire-0.3-dev python3 python3-pip python3-setuptools"
          - distro: ubuntu-24.04
            container: ubuntu:24.04
            sysdeps: "build-essential make pkg-config libpipewire-0.3-dev python3 python3-pip python3-setuptools"
          - distro: fedora
            container: fedora:latest
            sysdeps: "gcc make pkgconf-pkg-config pipewire-devel python3 python3-pip python3-setuptools"
            # deb 只在 Ubuntu 分发（Depends 按 AOSC 包名）
    container:
      image: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ${{ matrix.sysdeps }}
          else
            dnf install -y --quiet ${{ matrix.sysdeps }}
          fi

      - name: Build pure C shared libraries (libaimic.so + libpvpipe.so)
        # 使用仓库内已提交的捆绑 C onnxruntime 1.11.1 SDK（packages/onnxruntime-linux-x64-1.11.1），
        # 不做 Python 层 onnx/onnxruntime；aimic.c 链接 libonnxruntime.so.1.11.1。
        run: |
          LD_LIBRARY_PATH="$PWD/packages/onnxruntime-linux-x64-1.11.1/lib" \
            python3 setup.py build_ext --inplace --force
          test -f libaimic.so && test -f libpvpipe.so

      - name: Import smoke test (ctypes 加载纯 C 库)
        run: |
          LD_LIBRARY_PATH="$PWD/packages/onnxruntime-linux-x64-1.11.1/lib" \
            python3 -c "import aimic, pvpipe; print('aimic OK'); print('pvpipe OK')"

      - name: Package deb (Ubuntu only)
        if: matrix.distro != 'fedora'
        run: |
          python3 -m pip install --upgrade --break-system-packages pillow 2>/dev/null \
            || python3 -m pip install --upgrade pillow >/dev/null
          bash pack_deb.sh
          ls -lh dist/purevox_*.deb

      - name: Upload deb artifact
        if: matrix.distro != 'fedora'
        uses: actions/upload-artifact@v5
        with:
          name: purevox-deb-${{ matrix.distro }}
          path: dist/purevox_*.deb
          if-no-files-found: error

  python38-smoke:
    name: Python 3.8 compatibility smoke
    # 内嵌运行环境为 Python 3.8（Win7 最低）；用官方 python:3.8 镜像验证
    # 纯 C 库在该底线上可编译、可 ctypes 加载。
    runs-on: ubuntu-latest
    container:
      image: python:3.8-bullseye
    steps:
      - uses: actions/checkout@v5

      - name: Install gcc + PipeWire devel
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential pkg-config libpipewire-0.3-dev

      - name: Build pure C libraries under Python 3.8
        run: |
          LD_LIBRARY_PATH="$PWD/packages/onnxruntime-linux-x64-1.11.1/lib" \
            python setup.py build_ext --inplace --force
          test -f libaimic.so && test -f libpvpipe.so

      - name: import smoke under Python 3.8
        run: |
          LD_LIBRARY_PATH="$PWD/packages/onnxruntime-linux-x64-1.11.1/lib" \
            python -c "import sys, aimic; assert sys.version_info[:2] == (3, 8); print('aimic OK on Python', sys.version.split()[0])"
          LD_LIBRARY_PATH="$PWD/packages/onnxruntime-linux-x64-1.11.1/lib" \
            python -c "import pvpipe; print('pvpipe OK on Python 3.8')"