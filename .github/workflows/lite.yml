name: Lite CI

on:
  push:
    tags:
      - "lite-v*"
      - "lite*"
  workflow_dispatch:

jobs:
  windows-lite:
    name: Windows Lite (pure python, no gcc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set build timestamp (lite-v* -> lite version; else now)
        id: ts
        shell: pwsh
        run: |
          $ref = $env:GITHUB_REF_NAME
          if ($ref) {
            if ($ref.StartsWith("lite-v")) { $ref = $ref.Substring(6) }
            elseif ($ref.StartsWith("lite")) { $ref = $ref.Substring(4) -replace "^[-_]*","" }
            elseif ($ref.StartsWith("v")) { $ref = $ref.Substring(1) }
          }
          if ($ref) {
            $stamp = $ref -replace '\.', '-'
            $ver = $ref
          } else {
            $stamp = Get-Date -Format 'yyyy-MM-dd-HHmm'
            $ver = $stamp -replace '-', '.'
          }
          "stamp=$stamp" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "ver=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "BUILD_DATE=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-win.txt

      - name: Build Lite exe (build_lite_local.ps1, single recipe local+CI)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File build_lite_local.ps1

      - name: Upload Lite bundle (onedir)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: PureVoxLite-Windows-x64-${{ steps.ts.outputs.stamp }}
          path: dist/PureVoxLite/
          if-no-files-found: error

  release-lite:
    name: Release Lite (lite-v* -> attach)
    runs-on: ubuntu-latest
    needs: [windows-lite]
    if: startsWith(github.ref, 'refs/tags/lite')
    permissions:
      contents: write
    steps:
      - name: Download Lite artifacts
        uses: actions/download-artifact@v7.0.0
        with:
          path: artifacts
      - name: List Lite exe
        run: |
          find artifacts -type f -name "*.exe" | xargs ls -lh || true
      - name: Pack Lite bundle (onedir -> zip)
        run: |
          # download-artifact 不带子目录，exe 落在 artifacts/ 下；
          # 归位到固定目录 PureVoxLite/，保证解压即 PureVoxLite/PureVoxLite.exe
          exe=$(find artifacts -type f -name "PureVoxLite.exe" | head -n 1)
          rm -rf PureVoxLite
          mv "$(dirname "$exe")" PureVoxLite
          zip -9 -q -r "${GITHUB_WORKSPACE}/PureVoxLite-Windows-x64-${GITHUB_REF_NAME#lite-v}.zip" PureVoxLite
          unzip -l PureVoxLite-Windows-x64-*.zip | head -n 8
      - name: Create GitHub release for Lite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset=$(ls PureVoxLite-Windows-x64-*.zip)
          gh release create -R "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" --title "PureVox Lite ${GITHUB_REF_NAME}" --notes "Lite 纯 Python 版（无 gcc，Tk 像素风，onedir 解压即用）自动发布：${GITHUB_REF_NAME}" "$asset" || gh release upload "${GITHUB_REF_NAME}" "$asset" --clobber
