name: Lite CI

on:
  push:
    tags:
      - "lite-v*"
      - "lite*"
  workflow_dispatch:

jobs:
  windows-lite:
    name: Windows Lite (pure python, no gcc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set build timestamp (lite-v* -> lite version; else now)
        id: ts
        shell: pwsh
        run: |
          $ref = $env:GITHUB_REF_NAME
          if ($ref) {
            if ($ref.StartsWith("lite-v")) { $ref = $ref.Substring(6) }
            elseif ($ref.StartsWith("lite")) { $ref = $ref.Substring(4) -replace "^[-_]*","" }
            elseif ($ref.StartsWith("v")) { $ref = $ref.Substring(1) }
          }
          if ($ref) {
            $stamp = $ref -replace '\.', '-'
            $ver = $ref
          } else {
            $stamp = Get-Date -Format 'yyyy-MM-dd-HHmm'
            $ver = $stamp -replace '-', '.'
          }
          "stamp=$stamp" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "ver=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "BUILD_DATE=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-win.txt

      - name: Install Python deps (lite, no gcc)
        shell: pwsh
        run: |
          python -m pip install -q onnxruntime==1.22.0 numpy pillow pyinstaller
          try { python -m pip install -q pyaudio } catch { Write-Host "pyaudio optional, skip on CI" }
          Write-Host "deps OK"

      - name: Compile lite sources (catch syntax errors)
        shell: pwsh
        run: |
          python -m compileall -q lite_denoise_only
          Write-Host "compileall lite OK"

      - name: Smoke import lite (no gcc, pure python)
        shell: pwsh
        run: |
          python -c "import lite_denoise_only.config, lite_denoise_only.audio, lite_denoise_only.engine, lite_denoise_only.ui; print('lite import OK')"

      - name: Build Lite exe (PyInstaller onefile compressed, no gcc)
        shell: pwsh
        run: |
          # 生成像素 P ico 供 PyInstaller
          python -c "from PIL import Image, ImageDraw, ImageFont; import os; img=Image.new('RGBA',(256,256),(0,0,0,0)); d=ImageDraw.Draw(img); fp=os.path.join('lite_denoise_only','fonts','ark-pixel-12px-monospaced-zh_cn.ttf'); pf=ImageFont.truetype(fp,180) if os.path.isfile(fp) else ImageFont.load_default(); bbox=d.textbbox((0,0),'P',font=pf,stroke_width=8); tw=bbox[2]-bbox[0]; th=bbox[3]-bbox[1]; d.text(((256-tw)//2,(256-th)//2-5),'P',fill='#6D4C41',font=pf,stroke_width=8,stroke_fill='#FFB74D'); img.save('lite_icon.ico', sizes=[(256,256),(128,128),(64,64),(32,32),(16,16)])"
          if (Test-Path "lite_icon.ico") { Write-Host "icon generated" } else { Write-Host "icon fallback" }
          # 写入 _build_version
          $ver = "${{ steps.ts.outputs.ver }}"
          "BUILD_DATE = `"$ver`"" | Out-File -FilePath "_build_version.py" -Encoding utf8
          pyinstaller --noconfirm --onefile --windowed --name PureVoxLite --icon lite_icon.ico --collect-all onnxruntime --add-data "v9_fft2048_band256_epoch_261.onnx;." --add-data "lite_denoise_only/fonts;lite_denoise_only/fonts" --add-data "_build_version.py;." --strip lite_denoise_only/main.py
          if (-not (Test-Path "dist/PureVoxLite.exe")) { throw "PureVoxLite.exe not built" }
          Get-ChildItem dist/PureVoxLite.exe | Format-Table Name,Length
          # 单文件已压缩，无需额外打包

      - name: Upload Lite exe (single file)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: PureVoxLite-Windows-x64-${{ steps.ts.outputs.stamp }}
          path: dist/PureVoxLite.exe
          if-no-files-found: error

  release-lite:
    name: Release Lite (lite-v* -> attach)
    runs-on: ubuntu-latest
    needs: [windows-lite]
    if: startsWith(github.ref, 'refs/tags/lite')
    permissions:
      contents: write
    steps:
      - name: Download Lite artifacts
        uses: actions/download-artifact@v7.0.0
        with:
          path: artifacts
      - name: List Lite exe
        run: |
          find artifacts -type f -name "*.exe" | xargs ls -lh
      - name: Create GitHub release for Lite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(find artifacts -type f -name "*.exe" | tr '\n' ' ')
          gh release create -R "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" --title "PureVox Lite ${GITHUB_REF_NAME}" --notes "Lite 纯 Python 版（无 gcc，Tk 像素风，单文件压缩）自动发布：${GITHUB_REF_NAME}" $files || gh release upload "${GITHUB_REF_NAME}" $files --clobber
