name: PureVox Tests

# 独立测试工作流：每次分支 push / 手动触发，零打包、分钟级。
# 与 ci.yml（tag 触发的构建+发布）完全解耦：
#   - 打包检测的是「被打包物体和环境」（tag 时在 ci.yml 里做，
#     含产物级 bundled-runtime 冒烟）；
#   - 本工作流只测代码本身（播放正确性/传输降级/会话计划/引擎冒烟）。
# 缓存纪律：只读复用共享桶（actions/cache/restore，key 与 ci.yml 一致），
# 不新增写入点——落盘仍由 ci.yml 的单写者步骤负责（main dispatch）。

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  test:
    name: Tests (embedded Python 3.12, no packaging)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Restore ~/.cache/purevox (read-only reuse of shared cache)
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/purevox
          key: purevox-linux-cache-v2-cpython-3.12.14-appimagetool-x64

      # 内嵌解释器 = 发行产物同款运行时（tarball 命中缓存则免下载，无编译）
      - name: Bootstrap embedded Python + pinned deps
        run: ./bootstrap_python312.sh

      - name: Compile all sources (catch syntax errors)
        run: |
          ./py312 -m compileall -q pvengine pvplatform uitk server tests \
            audio_processor.py config_manager.py model_config.py \
            session_plan.py about_content.py run_tk.py wav_io.py user_paths.py
          echo "compileall OK"

      - name: Engine smoke (load model, denoise one frame)
        run: |
          ./py312 -c "from pvengine import AudioProcessor; ap = AudioProcessor(0.0); out = ap.process([0.0] * 480); assert len(out) == 480; print('pvengine OK on embedded Python')"

      - name: Test suite (playback correctness / transport / devices / session plan)
        run: |
          ./py312 tests/run_all.py
