name: Cache

# SOLE cache writer in the repo. ci.yml / lite.yml / test.yml are all
# restore-only; only this workflow saves. That keeps each bucket at exactly one
# entry per key instead of one duplicate per tag (GitHub cache scope = trigger
# ref, so tag-triggered saves are garbage nobody ever reads back).
#
# Warms on: main pushes touching deps/bootstrap/opus, weekly schedule (guards
# against eviction), manual dispatch (after bumping tools/automation/versions.env).

on:
  push:
    branches:
      - main
    paths:
      - 'requirements-win.txt'
      - 'requirements-linux.txt'
      - 'bootstrap_python312.sh'
      - 'tools/automation/versions.env'
      - 'android/opus-src/**'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  pip-windows:
    name: Pip cache (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Load cache generation (tools/automation/versions.env is canonical)
        shell: pwsh
        run: |
          Get-Content tools/automation/versions.env | Where-Object { $_ -match '^(\w+)=(.*)$' } | ForEach-Object {
            "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install deps
        shell: pwsh
        run: python -m pip install -q -r requirements-win.txt
      - name: Save pip cache
        uses: actions/cache/save@v6
        with:
          path: ~\AppData\Local\pip\Cache
          key: purevox-windows-pip-${{ env.WINDOWS_PIP_CACHE_GEN }}-${{ hashFiles('requirements-win.txt') }}

  bootstrap-linux:
    name: Bootstrap cache (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Load cache key (tools/automation/versions.env is canonical)
        run: |
          . tools/automation/versions.env
          echo "LINUX_CACHE_KEY=purevox-linux-cache-${LINUX_CACHE_GEN}-cpython-${PBS_CPYTHON_VER}-appimagetool-x64" >> "$GITHUB_ENV"
      - name: Bootstrap embedded Python + deps
        run: ./bootstrap_python312.sh
      - name: Save bootstrap cache
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/purevox
          key: ${{ env.LINUX_CACHE_KEY }}

  opus-android:
    name: Opus source (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Load cache key (tools/automation/versions.env is canonical)
        run: |
          . tools/automation/versions.env
          echo "OPUS_CACHE_KEY=purevox-android-opus-src-${OPUS_VER}" >> "$GITHUB_ENV"
      - name: Download Opus source (tools/automation/ensure_opus_src.sh is canonical)
        run: bash tools/automation/ensure_opus_src.sh
      - name: Save opus cache
        uses: actions/cache/save@v6
        with:
          path: android/opus-src
          key: ${{ env.OPUS_CACHE_KEY }}
