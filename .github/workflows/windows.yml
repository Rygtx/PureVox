name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build C++ extensions + smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-win.txt pybind11

      - name: Build C++ extensions (aimic.pyd)
        shell: pwsh
        run: python setup.py build_ext --inplace --force

      - name: Import smoke test
        shell: pwsh
        run: python -c "import aimic; print('aimic OK')"

  package:
    name: Package self-extracting EXE
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch'
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-win.txt pybind11 pyinstaller

      - name: Download opus.dll (gitignored, needed by server/)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/DSharpPlus/DSharpPlus/raw/master/docs/natives/vnext_natives_win32_x64.zip" -OutFile "$env:TEMP\opus.zip"
          Expand-Archive -Path "$env:TEMP\opus.zip" -DestinationPath "$env:TEMP\opus" -Force
          Copy-Item "$env:TEMP\opus\libopus.dll" "server\opus.dll" -Force
          if (-not (Test-Path "server\opus.dll")) { throw "opus.dll not found" }

      - name: Build self-extracting EXE
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File build_win.ps1

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PureVox-win-x64
          path: dist/PureVox_*.exe
          if-no-files-found: error
