name: PureVox Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Python code check (C build pending — mingw 改造待接入)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install Python-only deps (no native extension build yet)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # aimic C 绑定是本机阴性的事件：Windows 侧 mingw 改造未接入，
          # 这里只装纯 Python 依赖做语法/导入冒烟，不断言 aimic 可导入。
          python -m pip install -q -r requirements.txt -r requirements-win.txt

      - name: Compile all Python sources (catch syntax errors)
        shell: pwsh
        run: |
          python -m compileall -q aimic.py pvpipe.py audio_processor.py config_manager.py model_config.py ui_pyside6.py run_pyside6.py pvplatform utils server 2>$null
          Write-Host "compileall OK"

      - name: Smoke import (no native libs required)
        shell: pwsh
        run: |
          python -c "import config_manager, model_config; print('config modules OK')"

  package:
    name: Package self-extracting EXE
    runs-on: windows-latest
    # mingw C# 构建改造完成前，EXE 由本地打包（build_win.ps1）经手动触发产出
    if: github.event_name == 'workflow_dispatch'
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -q -r requirements.txt -r requirements-win.txt

      - name: Download opus.dll (gitignored, needed by server/)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/DSharpPlus/DSharpPlus/raw/master/docs/natives/vnext_natives_win32_x64.zip" -OutFile "$env:TEMP\opus.zip"
          Expand-Archive -Path "$env:TEMP\opus.zip" -DestinationPath "$env:TEMP\opus" -Force
          Copy-Item "$env:TEMP\opus\libopus.dll" "server\opus.dll" -Force
          if (-not (Test-Path "server\opus.dll")) { throw "opus.dll not found" }

      - name: Build self-extracting EXE
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File build_win.ps1

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PureVox-win-x64
          path: dist/PureVox_*.exe
          if-no-files-found: error