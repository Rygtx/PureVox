<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>音频调试</title></head><body>
<h2>调试</h2>
<select id="micSelect" style="width:400px"></select>
<button id="btnTest">测试</button>
<pre id="log"></pre>
<script>
const logEl = document.getElementById('log');
const micSelect = document.getElementById('micSelect');
const btnTest = document.getElementById('btnTest');
function add(msg) { logEl.textContent += msg + '\n'; }

// 列出所有麦克风
async function listMics() {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const mics = devices.filter(d => d.kind === 'audioinput');
    micSelect.innerHTML = mics.map((m, i) =>
        `<option value="${m.deviceId}">${m.label || '麦克风 #' + (i+1)}</option>`
    ).join('');
    add('找到 ' + mics.length + ' 个麦克风:');
    mics.forEach(m => add('  - ' + (m.label || '无标签') + ' (deviceId=' + m.deviceId.slice(0,16) + '...)'));
}
navigator.mediaDevices.addEventListener('devicechange', listMics);
listMics();

btnTest.onclick = async () => {
    logEl.textContent = '';
    const deviceId = micSelect.value;
    if (!deviceId) { add('请选择一个麦克风'); return; }

    add('选择设备: ' + micSelect.selectedOptions[0].text);

    // Step 1: getUserMedia with exact deviceId
    let stream;
    try {
        stream = await navigator.mediaDevices.getUserMedia({
            audio: { deviceId: { exact: deviceId } }
        });
        add('OK: getUserMedia 成功');
    } catch(e) { add('致命: ' + e.message); return; }

    const track = stream.getAudioTracks()[0];
    add('  track.label = ' + track.label);

    // Step 2: AudioContext
    const ctx = new AudioContext();
    add('  ctx.sampleRate = ' + ctx.sampleRate);
    if (ctx.state === 'suspended') { await ctx.resume(); add('  resume -> ' + ctx.state); }

    const source = ctx.createMediaStreamSource(stream);

    // Step 3: AudioWorklet test（480 样本/帧 = 10ms，与引擎 hop 一致）
    await ctx.audioWorklet.addModule('js/pcm-worklet.js');
    const node = new AudioWorkletNode(ctx, 'pcm-encoder-processor',
        { outputChannelCount: [1] });
    let frameCount = 0;
    node.port.onmessage = (e) => {
        if (e.data.type !== 'pcm') return;
        frameCount++;
        if (frameCount <= 5) {
            const ch = new Float32Array(e.data.data);
            let max = 0;
            for (let i = 0; i < ch.length; i++) {
                const a = Math.abs(ch[i]);
                if (a > max) max = a;
            }
            add('  AudioWorklet #' + frameCount + '  len=' + ch.length + '  max=' + max.toFixed(8));
        }
    };
    source.connect(node);
    node.connect(ctx.destination);   // worklet 输出恒静音，仅为保持节点被拉动

    add('等待 3 秒数据... 请对着麦克风说话');
    await new Promise(r => setTimeout(r, 3000));
    add('AudioWorklet 共输出 ' + frameCount + ' 帧 (480/帧=10ms)');
    add('测试完成');
};
</script>
</body></html>
